<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PagFlow → Shopee</title>
  <style>
    :root {
      --brand: #ee4d2d;
      --brand-dark: #d73211;
      --surface: #ffffff;
      --surface-2: #f9f9f9;
      --border: #e8e8e8;
      --text: #212121;
      --text-2: #6b6b6b;
      --text-3: #9e9e9e;
      --green: #16a34a;
      --yellow: #d97706;
      --radius: 8px;
      --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: var(--brand);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .header-subtitle {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1;
      margin-top: 2px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: var(--text); }

    /* ── Search ── */
    .search-bar {
      padding: 10px 16px 0;
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--brand); background: #fff; }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 16px 6px;
      flex-shrink: 0;
    }
    .status-text {
      font-size: 11px;
      color: var(--text-3);
    }
    .status-text strong { color: var(--text-2); }

    /* ── Order list ── */
    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
    }
    .order-list:empty::after {
      content: 'Nenhum pedido encontrado';
      display: block;
      text-align: center;
      color: var(--text-3);
      padding: 32px 0;
      font-size: 12px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
      transition: border-color 0.15s;
    }
    .order-card:hover { border-color: #d0d0d0; }
    .order-card.processed {
      opacity: 0.5;
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .order-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      line-height: 1.3;
    }
    .order-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pago { background: #dcfce7; color: #16a34a; }
    .badge-done { background: #f0f0f0; color: #888; }

    .order-addr {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .order-addr span {
      display: block;
    }

    .order-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .order-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
    }
    .order-date {
      font-size: 11px;
      color: var(--text-3);
    }

    .add-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 7px 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .add-btn:hover { background: var(--brand-dark); }
    .add-btn:disabled {
      background: #f0f0f0;
      color: #999;
      cursor: not-allowed;
    }
    .add-btn.done {
      background: #f0f0f0;
      color: #16a34a;
    }

    /* ── Loading / Error ── */
    .state-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-3);
      font-size: 12px;
    }
    .state-msg.error { color: #dc2626; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Settings panel ── */
    .settings-panel {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--surface-2);
      flex-shrink: 0;
      display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .settings-panel input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 8px;
      outline: none;
    }
    .settings-panel input:focus { border-color: var(--brand); }
    .save-btn {
      padding: 6px 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .save-btn:hover { background: var(--brand-dark); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="logo">P</div>
      <div>
        <h1>PagFlow → Shopee</h1>
        <div class="header-subtitle">Pedidos pagos aguardando envio</div>
      </div>
    </div>
    <button class="settings-btn" id="settings-toggle" title="Configurações">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="search-bar">
    <input class="search-input" id="search" type="text" placeholder="Buscar por nome ou cidade..." />
  </div>

  <div class="status-bar">
    <div class="status-text" id="status-text">Carregando pedidos...</div>
  </div>

  <div class="order-list" id="order-list">
    <div class="state-msg">
      <div class="spinner"></div><br/>Buscando pedidos no PagFlow...
    </div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <label>URL da API</label>
    <input type="text" id="cfg-url" placeholder="https://mcp.elabela.store" />
    <label>API Key</label>
    <input type="text" id="cfg-key" placeholder="hermes-pagflow-key" />
    <button class="save-btn" id="save-settings">Salvar</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
