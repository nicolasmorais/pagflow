<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PagFlow → Shopee</title>
  <style>
    :root {
      --brand: #ee4d2d;
      --brand-dark: #d73211;
      --surface: #ffffff;
      --surface-2: #f9f9f9;
      --border: #e8e8e8;
      --text: #212121;
      --text-2: #6b6b6b;
      --text-3: #9e9e9e;
      --green: #16a34a;
      --yellow: #d97706;
      --radius: 8px;
      --shadow: 0 2px 12px rgba(0,0,0,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 200px;
      max-height: 560px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface);
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo {
      width: 28px;
      height: 28px;
      background: var(--brand);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1;
    }
    .header-subtitle {
      font-size: 11px;
      color: var(--text-3);
      line-height: 1;
      margin-top: 2px;
    }
    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-3);
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      transition: color 0.15s;
    }
    .settings-btn:hover { color: var(--text); }

    /* ── Search ── */
    .search-bar {
      padding: 10px 16px 0;
      flex-shrink: 0;
    }
    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      background: var(--surface-2);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-input:focus { border-color: var(--brand); background: #fff; }

    /* ── Status bar ── */
    .status-bar {
      padding: 8px 16px 6px;
      flex-shrink: 0;
    }
    .status-text {
      font-size: 11px;
      color: var(--text-3);
    }
    .status-text strong { color: var(--text-2); }

    /* ── Order list ── */
    .order-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
    }
    .order-list:empty::after {
      content: 'Nenhum pedido encontrado';
      display: block;
      text-align: center;
      color: var(--text-3);
      padding: 32px 0;
      font-size: 12px;
    }

    .order-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-top: 8px;
      transition: border-color 0.15s;
    }
    .order-card:hover { border-color: #d0d0d0; }
    .order-card.processed {
      opacity: 0.5;
    }

    .order-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }
    .order-name {
      font-weight: 600;
      font-size: 13px;
      color: var(--text);
      line-height: 1.3;
    }
    .order-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-pago { background: #dcfce7; color: #16a34a; }
    .badge-done { background: #f0f0f0; color: #888; }

    .order-addr {
      font-size: 11px;
      color: var(--text-2);
      line-height: 1.4;
      margin-bottom: 8px;
    }
    .order-addr span {
      display: block;
    }

    .order-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .order-value {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand);
    }
    .order-date {
      font-size: 11px;
      color: var(--text-3);
    }

    .add-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 7px 12px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .add-btn:hover { background: var(--brand-dark); }
    .add-btn:disabled {
      background: #f0f0f0;
      color: #999;
      cursor: not-allowed;
    }
    .add-btn.done {
      background: #f0f0f0;
      color: #16a34a;
    }

    /* ── Qty row ── */
    .qty-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }
    .qty-label {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .qty-preview { color: var(--brand); font-weight: 600; }
    .qty-input {
      width: 56px;
      padding: 4px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
      outline: none;
    }
    .qty-input:focus { border-color: var(--brand); }
    .qty-input:disabled { background: #f5f5f5; color: #bbb; }

    /* ── Product config list ── */
    .prod-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .prod-row:last-child { border-bottom: none; }
    .prod-name {
      font-size: 11px;
      color: var(--text);
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prod-qty-input {
      width: 48px;
      padding: 3px 5px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      outline: none;
    }
    .prod-qty-input:focus { border-color: var(--brand); }
    .prod-save-btn {
      padding: 3px 8px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .prod-save-btn:hover { background: var(--brand-dark); }
    .prod-save-btn.saved { background: var(--green); }

    /* ── Loading / Error ── */
    .state-msg {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-3);
      font-size: 12px;
    }
    .state-msg.error { color: #dc2626; }
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Settings panel ── */
    .settings-panel {
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      background: var(--surface-2);
      flex-shrink: 0;
      display: none;
    }
    .settings-panel.open { display: block; }
    .settings-panel label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-2);
      margin-bottom: 4px;
    }
    .settings-panel input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 5px;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 8px;
      outline: none;
    }
    .settings-panel input:focus { border-color: var(--brand); }
    .save-btn {
      padding: 6px 14px;
      background: var(--brand);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .save-btn:hover { background: var(--brand-dark); }

    /* ── Seleção de pedidos ── */
    .order-pick {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      min-width: 0;
      cursor: pointer;
    }
    .order-pick input {
      width: 15px;
      height: 15px;
      margin-top: 1px;
      flex-shrink: 0;
      accent-color: var(--brand);
      cursor: pointer;
    }
    .order-card.selected { border-color: var(--brand); background: #fffaf8; }
    .bulk-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .bulk-bar .add-btn { margin-top: 0; flex: 1; }
    body.addr-mode .bulk-bar { display: none !important; }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .addr-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fff;
      color: #dc2626;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .addr-open-btn:hover { background: #fef2f2; }
    .addr-open-btn.active { background: #dc2626; border-color: #dc2626; color: #fff; }

    /* ── Painel de exclusão de endereços ── */
    .addr-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }
    .addr-panel.open { display: flex; }
    body.addr-mode .search-bar,
    body.addr-mode .status-bar,
    body.addr-mode .order-list,
    body.addr-mode .settings-panel { display: none !important; }

    .addr-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px 8px;
      flex-shrink: 0;
    }
    .addr-title { font-size: 13px; font-weight: 600; }
    .addr-sub { font-size: 11px; color: var(--text-3); margin-top: 2px; }
    .link-btn {
      background: none;
      border: none;
      padding: 2px 0;
      color: var(--brand);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .link-btn:hover { text-decoration: underline; }
    .addr-filters {
      display: flex;
      gap: 12px;
      padding: 0 16px 6px;
      flex-shrink: 0;
    }
    .addr-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 8px;
      min-height: 120px;
      max-height: 340px;
    }
    .addr-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 9px 8px;
      border-radius: 6px;
      cursor: pointer;
    }
    .addr-item + .addr-item { border-top: 1px solid var(--border); }
    .addr-item:hover { background: var(--surface-2); }
    .addr-item.locked { cursor: default; opacity: 0.6; }
    .addr-item.locked:hover { background: none; }
    .addr-item input { margin-top: 2px; accent-color: var(--brand); flex-shrink: 0; }
    .addr-item-body { flex: 1; min-width: 0; }
    .addr-item-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .addr-item-line {
      font-size: 11px;
      color: var(--text-2);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-top: 1px;
    }
    .addr-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: 1px;
    }
    .addr-tag.pf { background: #fff1ee; color: var(--brand-dark); }
    .addr-tag.lock { background: #f0f0f0; color: #777; }
    .addr-foot {
      padding: 10px 16px 12px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .danger-btn {
      display: block;
      width: 100%;
      padding: 8px 12px;
      background: #dc2626;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .danger-btn:hover { background: #b91c1c; }
    .danger-btn:disabled { background: #f0f0f0; color: #999; cursor: not-allowed; }
    .addr-progress {
      font-size: 11px;
      color: var(--text-2);
      margin-top: 8px;
      line-height: 1.4;
    }
    .addr-progress.ok { color: var(--green); }
    .addr-progress.err { color: #dc2626; }
    .progress-track {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill { height: 100%; background: #dc2626; width: 0; transition: width 0.3s; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="logo">P</div>
      <div>
        <h1>PagFlow → Shopee</h1>
        <div class="header-subtitle">Pedidos pagos</div>
      </div>
    </div>
    <div class="header-actions">
    <button class="addr-open-btn" id="addr-toggle" title="Excluir endereços da Shopee">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
      </svg>
      Excluir endereços
    </button>
    <button class="settings-btn" id="settings-toggle" title="Configurações" aria-label="Configurações">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    </div>
  </div>

  <div class="addr-panel" id="addr-panel">
    <div class="addr-head">
      <div>
        <div class="addr-title">Excluir endereços da Shopee</div>
        <div class="addr-sub" id="addr-sub">Lendo a página de endereços...</div>
      </div>
      <button class="link-btn" id="addr-back">Voltar</button>
    </div>
    <div class="addr-filters" id="addr-filters" style="display:none">
      <button class="link-btn" data-select="all">Selecionar todos</button>
      <button class="link-btn" data-select="pagflow">Só do PagFlow</button>
      <button class="link-btn" data-select="none">Limpar seleção</button>
    </div>
    <div class="addr-list" id="addr-list"></div>
    <div class="addr-foot">
      <button class="danger-btn" id="addr-delete" disabled>Excluir selecionados</button>
      <div class="addr-progress" id="addr-progress" role="status"></div>
    </div>
  </div>

  <div class="search-bar">
    <input class="search-input" id="search" type="text" placeholder="Buscar por nome ou cidade..." />
  </div>

  <div class="status-bar">
    <div class="status-text" id="status-text">Carregando pedidos...</div>
  </div>

  <div class="order-list" id="order-list">
    <div class="state-msg">
      <div class="spinner"></div><br/>Buscando pedidos no PagFlow...
    </div>
  </div>

  <div class="bulk-bar" id="bulk-bar" style="display:none">
    <button class="link-btn" id="bulk-all">Selecionar todos</button>
    <button class="add-btn" id="bulk-add" disabled>Selecione pedidos</button>
  </div>

  <div class="settings-panel" id="settings-panel">
    <label>URL do PagFlow (pedidos)</label>
    <input type="text" id="cfg-pagflow" placeholder="https://pay.elabela.store" />
    <label>URL da API (quantidade por produto)</label>
    <input type="text" id="cfg-url" placeholder="https://mcp.elabela.store" />
    <label>API Key</label>
    <input type="text" id="cfg-key" placeholder="hermes-pagflow-key" />
    <button class="save-btn" id="save-settings">Salvar</button>

    <div style="margin-top:12px;border-top:1px solid var(--border);padding-top:10px;">
      <div style="font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:8px;">Quantidade por produto</div>
      <div id="product-list-cfg" style="font-size:12px;color:var(--text-3);">Carregando produtos...</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
