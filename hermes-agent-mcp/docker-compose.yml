services:
  hermes-mcp:
    build: .
    container_name: hermes-mcp
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 3
